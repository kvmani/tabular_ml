<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Leakage-aware tabular machine learning</title><desc id="d">A table is profiled and split, fold pipelines are fitted, candidates compared, and one final holdout evaluation performed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6279c4"/></marker></defs><rect width="1000" height="430" rx="25" fill="#f2f3fa"/><rect x="28" y="28" width="944" height="72" rx="16" fill="#26335f"/><text x="58" y="60" fill="#bdc9ff" font-family="Arial" font-size="13" font-weight="700">TABLE → GENERALIZABLE PREDICTION</text><text x="58" y="85" fill="white" font-family="Arial" font-size="22" font-weight="700">Profile → split → fit folds → compare → holdout</text><g font-family="Arial"><g transform="translate(42 145)"><rect width="160" height="118" rx="14" fill="white" stroke="#c7cce1"/><text x="16" y="30" fill="#d05c45" font-size="12" font-weight="700">01 PROFILE</text><text x="16" y="60" fill="#26335f" font-size="17" font-weight="700">Table + target</text><text x="16" y="89" fill="#606878" font-size="12">types · leakage</text></g><g transform="translate(230 145)"><rect width="160" height="118" rx="14" fill="#eaedfb" stroke="#6279c4"/><text x="16" y="30" fill="#485fa7" font-size="12" font-weight="700">02 SPLIT</text><text x="16" y="60" fill="#26335f" font-size="17" font-weight="700">Train / holdout</text><text x="16" y="89" fill="#606878" font-size="12">groups · time · strata</text></g><g transform="translate(418 145)"><rect width="160" height="118" rx="14" fill="white" stroke="#c7cce1"/><text x="16" y="30" fill="#d05c45" font-size="12" font-weight="700">03 FIT</text><text x="16" y="60" fill="#26335f" font-size="17" font-weight="700">Fold pipeline</text><text x="16" y="89" fill="#606878" font-size="12">prepare + model</text></g><g transform="translate(606 145)"><rect width="160" height="118" rx="14" fill="#fff4e8" stroke="#e6b078"/><text x="16" y="30" fill="#b95a3e" font-size="12" font-weight="700">04 COMPARE</text><text x="16" y="60" fill="#26335f" font-size="17" font-weight="700">Cross-validate</text><text x="16" y="89" fill="#606878" font-size="12">metric distribution</text></g><g transform="translate(794 145)"><rect width="160" height="118" rx="14" fill="#26335f"/><text x="16" y="30" fill="#bdc9ff" font-size="12" font-weight="700">05 TEST</text><text x="16" y="60" fill="white" font-size="17" font-weight="700">Holdout once</text><text x="16" y="89" fill="#e0e3f0" font-size="12">explain · export</text></g></g><g stroke="#6279c4" stroke-width="3" marker-end="url(#a)"><path d="M203 204H223"/><path d="M391 204H411"/><path d="M579 204H599"/><path d="M767 204H787"/></g><rect x="42" y="305" width="912" height="78" rx="14" fill="white" stroke="#c7cce1"/><text x="70" y="351" fill="#26335f" font-family="Georgia" font-size="23" font-weight="700">z_j = (x_j − μ_train,j) / σ_train,j</text><text x="550" y="350" fill="#606878" font-family="Arial" font-size="13">Training statistics never cross the leakage barrier.</text></svg>
