[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-ml-service"
version = "0.1.0"
description = "Privacy-first visual workbench for tabular machine learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "tabular_ml contributors"}]
keywords = ["machine-learning", "tabular-data", "flask", "data-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "Flask>=3.0,<4",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-waitress>=3.0,<4",
]

[project.scripts]
tabular-ml = "tabular_ml_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabular_ml_service = [
  "datasets/*.csv",
  "datasets/*.json",
  "static/*",
  "templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tabular_ml_service"]
omit = ["src/tabular_ml_service/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tabular_ml_service"]

[[tool.mypy.overrides]]
module = ["joblib", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "tabular_ml_service.core.preprocessing",
  "tabular_ml_service.core.training",
]
disallow_subclassing_any = false
