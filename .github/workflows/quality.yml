name: quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: python scripts/vendor_datasets.py --check
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
