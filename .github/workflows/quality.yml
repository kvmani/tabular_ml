name: quality

# Manual only (maintainer's policy, 2026-10-08): CI costs GitHub minutes, so it never runs on
# push, pull request or a schedule. Start it from the Actions tab ("Run workflow") before a
# release or an upgrade; day to day, run the same steps locally (AGENTS.md).
on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: python scripts/vendor_datasets.py --check
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
